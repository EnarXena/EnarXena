<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EnarXena</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      height: 100%;
      font-family: Arial, sans-serif;
      color: #fff;
      overflow: hidden;
      cursor: pointer;
    }

    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
      transition: opacity 1s ease;
    }

    #clickText { font-size: 22px; }

    .dots {
      display: none;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 8px;
    }

    .dot {
      display: inline-block;
      animation: moveDots 2.5s infinite ease-in-out;
    }

    .dot:nth-child(2) { animation-delay: 0.4s; }
    .dot:nth-child(3) { animation-delay: 0.8s; }

    @keyframes moveDots {
      0% { transform: translateX(0); opacity: 1; }
      50% { transform: translateX(10px); opacity: 0.4; }
      100% { transform: translateX(0); opacity: 1; }
    }

    .video-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    .center-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.6);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      opacity: 0;
      transition: 0.5s;
    }

    .center-box:hover {
      transform: translate(-50%, -50%) scale(1.05);
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin-bottom: 20px;
      border: 3px solid #fff;
      object-fit: cover;
    }

    .nickname {
      font-size: 1.8rem;
      font-weight: bold;
      text-shadow: 0 0 10px #fff;
      margin-bottom: 15px;
    }

    .social-links {
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    .social-links a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      text-shadow: 0 0 10px #fff;
    }

    .sound-control {
      position: fixed;
      top: 20px;
      left: 20px;
    }

    .sound-icon {
      width: 30px;
      height: 30px;
      background: #000;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .volume-slider {
      display: none;
    }

    #particleCanvas {
      position: fixed;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>

<body>

<div id="overlay">
  <div id="clickText">Click to enter</div>
  <div class="dots" id="dots">
    <span class="dot">•</span>
    <span class="dot">•</span>
    <span class="dot">•</span>
  </div>
</div>

<!-- ✅ Видео -->
<video class="video-background" id="bgVideo" autoplay muted loop playsinline>
  <source src="5823293843_1_tiktok_69c2aa699606e7_84314282.mp4" type="video/mp4">
</video>

<audio id="bgMusic" loop>
  <source src="SWEET SPINE - 888 (Official Music Video).mp3" type="audio/mpeg">
</audio>

<div class="center-box" id="bioBox">
  <img src="image.png" class="avatar">
  <div class="nickname">EnarXena</div>
  <div class="social-links">
    <a href="#">Discord</a> ·
    <a href="#">TikTok</a> ·
    <a href="#">Steam</a>
  </div>
</div>

<canvas id="particleCanvas"></canvas>

<script>
const overlay = document.getElementById("overlay");
const clickText = document.getElementById("clickText");
const dots = document.getElementById("dots");
const music = document.getElementById("bgMusic");
const bioBox = document.getElementById("bioBox");
const video = document.getElementById("bgVideo");

let started = false;

// ✅ фикс скорости видео
video.addEventListener("loadeddata", () => {
  video.playbackRate = 1.0;
});

overlay.addEventListener("click", () => {
  if (started) return;
  started = true;

  clickText.style.display = "none";
  dots.style.display = "block";

  music.play().catch(()=>{});

  setTimeout(() => {
    overlay.style.opacity = "0";
    bioBox.style.opacity = "1";
    setTimeout(() => overlay.style.display = "none", 1000);
  }, 2000);
});

// 🎨 частицы
const canvas = document.getElementById("particleCanvas");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let particles = [];
let mouse = { x: innerWidth/2, y: innerHeight/2 };

addEventListener("mousemove", e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

class Particle {
  constructor(){
    this.x = mouse.x;
    this.y = mouse.y;
    this.size = Math.random()*2+1;
    this.speedX = (Math.random()-0.5)*2;
    this.speedY = (Math.random()-0.5)*2;
  }

  update(){
    this.x += this.speedX;
    this.y += this.speedY;
    this.size *= 0.95;
  }

  draw(){
    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fill();
  }
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.push(new Particle());

  particles.forEach((p,i)=>{
    p.update();
    p.draw();
    if(p.size<0.2) particles.splice(i,1);
  });

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
