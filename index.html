<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EnarXena</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: #fff;
      cursor: pointer;
    }

    /* затемнение поверх видео (чтобы текст читался) */
    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      z-index: 0;
    }

    #overlay {
      position: fixed;
      width: 100%;
      height: 100%;
      background: black;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: 1s;
    }

    #clickText {
      font-size: 22px;
    }

    .dots {
      display: none;
      letter-spacing: 10px;
    }

    .dot {
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%,100% {opacity: 1;}
      50% {opacity: 0.3;}
    }

    .video-background {
      position: fixed;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    .center-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.6);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      opacity: 0;
      transition: 0.5s;
      z-index: 2;
    }

    .avatar {
      width: 120px;
      border-radius: 50%;
      margin-bottom: 15px;
    }

    .nickname {
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .social-links a {
      color: white;
      margin: 0 5px;
      text-decoration: none;
    }

  </style>
</head>

<body>

  <div id="overlay">
    <div id="clickText">Click to enter</div>
    <div class="dots" id="dots">
      <span class="dot">•</span>
      <span class="dot">•</span>
      <span class="dot">•</span>
    </div>
  </div>

  <!-- ВАЖНО: ВСТАВЬ СЮДА СВОЮ ССЫЛКУ -->
  <video class="video-background" autoplay muted loop playsinline>
    <source src="https://raw.githubusercontent.com/ТВОЙ_НИК/ТВОЙ_РЕПО/main/5823293843_1_tiktok_69c2aa699606e7_84314282.mp4" type="video/mp4">
  </video>

  <audio id="bgMusic" loop>
    <source src="akkiemi_-_winter_shards_(SkySound.cc).mp3">
  </audio>

  <div class="center-box" id="bioBox">
    <img src="image.png" class="avatar">
    <div class="nickname">EnarXena</div>

    <div class="social-links">
      <a href="#">Discord</a>
      <a href="#">TikTok</a>
      <a href="#">Steam</a>
    </div>
  </div>

  <script>
    const overlay = document.getElementById("overlay");
    const dots = document.getElementById("dots");
    const clickText = document.getElementById("clickText");
    const bioBox = document.getElementById("bioBox");
    const music = document.getElementById("bgMusic");

    overlay.onclick = () => {
      clickText.style.display = "none";
      dots.style.display = "block";

      music.play().catch(()=>{});

      setTimeout(() => {
        overlay.style.opacity = "0";
        bioBox.style.opacity = "1";
        setTimeout(()=>overlay.style.display="none",1000);
      }, 3000);
    };
  </script>

</body>
</html>
